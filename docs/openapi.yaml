openapi: 3.1.0
info:
  title: CoGom 개발 카페 API
  version: 0.1.0
  description: |
    초대 링크로 같은 테이블에 앉아 각자 목표를 세우고, 공유 타이머에 맞춰
    25분 집중과 5분 휴식을 진행한다. 헬스 체크, 회원가입, 로그인, 내 계정 조회는
    구현되어 있으며 테이블과 라운드 경로는 MVP 구현 계약이다.

    ## 화면과 요청

    | 화면 | 동작 | 요청 |
    | --- | --- | --- |
    | 회원가입 | 계정 생성 | POST /auth/signup |
    | 로그인 | 자격 증명 확인과 액세스 토큰 발급 | POST /auth/login |
    | 계정 | 액세스 토큰으로 내 계정 조회 | GET /auth/me |
    | 카페 입구 | 링크로 테이블 이름, 좌석 수, 현재 단계 확인 | POST /invitations/preview |
    | 착석 | 닉네임과 목표 등록 | POST /invitations/join |
    | 집중 | 시작, 자리 비움·복귀, 휴식 때 도움 요청 | POST /tables/{tableId}/rounds, PUT .../presence, PUT .../help |
    | 휴식·회고 | 결과와 한 줄 메모 공유 | PUT .../review |
    | 다음 라운드 | 새 목표 준비 | PUT /tables/{tableId}/members/me/goal |
    | 테이블 공통 | 새로고침 복구, 상태 구독, 퇴장 | GET /tables/{tableId}, GET .../events, DELETE .../members/me |

    ## 계정 인증

    - 프런트엔드는 Vite 프록시 또는 동일 출처 배포에서 상대 경로 /api/v1/auth/...를 사용한다.
      로그인으로 발급된 토큰은 메모리에 보관하고, 계정 조회 시 Authorization Bearer 헤더로 전송한다.
    - 액세스 토큰은 30분간 유효한 HS256 JWT다. iss는 cogom-api, aud는 cogom-fe,
      sub는 계정 UUID이며 iat와 exp에 발급 및 만료 시각을 담는다.
    - 배포에는 HTTPS를 사용한다. COGOM_JWT_SECRET에는 디코딩 후 32바이트 이상인
      표준 Base64 값을 지정한다. 생략하면 서버 시작마다 임의의 키를 생성한다.

    ## 세션과 동시성

    - 테이블을 만들거나 초대로 들어가면 COGOM_GUEST 쿠키를 발급한다.
      쿠키는 게스트를 식별하며 멤버십은 테이블별로 확인한다.
      배포는 같은 오리진을 사용하고 쿠키에 HttpOnly, SameSite=Lax, Secure를 설정한다.
      상태 변경 요청에는 서버에서 Origin을 검증한다.
    - 초대 링크는 /join#token=... 형태로 전달하고, 클라이언트는 토큰을 JSON 본문에 담는다.
      서버는 토큰의 해시를 보관한다. 테이블과 초대 링크는 생성 후 7일간 유효하다.
      쿠키 세션은 마지막 발급으로부터 7일간 유효하다.
    - 생성, 착석, 시작 POST에는 동작마다 새 Idempotency-Key를 만들고 재시도에 같은 키를 쓴다.
      서버는 요청 본문과 현재 세션에 묶어 10분간 최초 결과를 재사용한다.
      첫 요청에 쿠키가 없으면 예측 불가능한 키와 동일 본문으로 최초 응답과 쿠키를 복원한다.
      같은 키에 다른 본문을 보내면 409를 반환한다.
    - 마지막 좌석 착석과 라운드 시작은 테이블 단위로 원자적으로 처리한다.
      동일 세션의 여러 탭은 같은 좌석을 사용한다. 연결이 잠시 끊겨도 좌석을 유지하고,
      명시적으로 퇴장하면 좌석을 비운다. 재착석 시 기존 참여 기록을 이어서 사용한다.

    ## 시간과 동기화

    - 시작 시 서버가 startedAt, focusEndsAt, breakEndsAt을 확정한다.
      focusEndsAt부터 BREAK, breakEndsAt부터 FINISHED다. 이후 테이블은 WAITING으로 돌아간다.
      자리 비움과 새로고침은 시간에 영향을 주지 않는다.
    - 모든 HTTP 테이블 응답과 실시간 snapshot에는 version과 serverNow가 있다.
      클라이언트는 snapshot 수신 시각을 기준으로 서버 시각을 보정하고
      현재 단계의 종료 시각까지 남은 초를 로컬에서 계산한다.
    - 상태 변경과 자동 시간 전환마다 version을 증가시킨다. 재연결 시 현재 snapshot을 먼저 받는다.
      이미 처리한 version 이하의 이벤트는 건너뛴다. 만료 시각이 됐는데 새 snapshot이 오지 않으면
      GET /tables/{tableId}로 최신 상태를 다시 읽는다.
    - 회고는 휴식 시작부터 다음 라운드 시작 전까지 수정할 수 있다. 다음 목표의 기본값은
      회고가 CONTINUE 또는 BLOCKED이면 해당 목표, DONE이면 빈 값으로 화면에서 제안한다.
      카페 소리 설정은 브라우저에서 관리한다.
servers:
  - url: /api/v1
security:
  - GuestCookie: []
tags:
  - name: 운영
  - name: 계정
  - name: 테이블
  - name: 라운드
paths:
  /health:
    get:
      tags: [운영]
      summary: 서비스 상태 확인
      operationId: getHealth
      security: []
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: UP, serverNow: '2026-11-11T11:00:00Z' }
  /auth/signup:
    post:
      tags: [계정]
      summary: 계정 생성
      description: 로그인은 계정 생성 후 별도로 요청한다.
      operationId: signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, nickname]
              properties:
                email: { $ref: '#/components/schemas/AccountEmailInput' }
                password: { $ref: '#/components/schemas/SignupPasswordInput' }
                nickname: { $ref: '#/components/schemas/AccountNicknameInput' }
            example: { email: Jimin@example.com, password: 'correct horse battery staple', nickname: 지민 }
      responses:
        '201':
          description: 계정 생성 완료
          headers:
            Cache-Control: { $ref: '#/components/headers/AuthCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
              example: { id: 17010000-0000-4000-8000-000000000001, email: jimin@example.com, nickname: 지민 }
        '400': { $ref: '#/components/responses/AuthValidationError' }
        '409':
          description: EMAIL_ALREADY_EXISTS. 정규화한 이메일이 이미 등록되어 있다.
          headers:
            Cache-Control: { $ref: '#/components/headers/AuthCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
              example: { code: EMAIL_ALREADY_EXISTS, message: 이미 가입된 이메일입니다. }
        '415': { $ref: '#/components/responses/AuthUnsupportedMediaType' }
  /auth/login:
    post:
      tags: [계정]
      summary: 계정 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { $ref: '#/components/schemas/AccountEmailInput' }
                password: { $ref: '#/components/schemas/LoginPasswordInput' }
            example: { email: jimin@example.com, password: 'correct horse battery staple' }
      responses:
        '200':
          description: 로그인 성공 및 액세스 토큰 발급
          headers:
            Cache-Control: { $ref: '#/components/headers/AuthCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.example.signature
                tokenType: Bearer
                expiresIn: 1800
                user: { id: 17010000-0000-4000-8000-000000000001, email: jimin@example.com, nickname: 지민 }
        '400': { $ref: '#/components/responses/AuthValidationError' }
        '401':
          description: INVALID_CREDENTIALS. 등록되지 않은 이메일과 잘못된 비밀번호에 같은 응답을 반환한다.
          headers:
            Cache-Control: { $ref: '#/components/headers/AuthCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
              example: { code: INVALID_CREDENTIALS, message: 이메일 또는 비밀번호를 확인해 주세요. }
        '429':
          description: TOO_MANY_REQUESTS. 클라이언트 주소당 분당 로그인 시도 10회를 초과했다.
          headers:
            Cache-Control: { $ref: '#/components/headers/AuthCacheControl' }
            Retry-After:
              description: 다음 로그인 시도까지 기다릴 시간(초)
              schema: { type: integer, minimum: 1 }
              example: 30
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
              example: { code: TOO_MANY_REQUESTS, message: 잠시 후 다시 시도해 주세요. }
        '415': { $ref: '#/components/responses/AuthUnsupportedMediaType' }
  /auth/me:
    get:
      tags: [계정]
      summary: 내 계정 조회
      operationId: getMyAccount
      security: [{ AccountBearer: [] }]
      responses:
        '200':
          description: 토큰에 연결된 계정
          headers:
            Cache-Control: { $ref: '#/components/headers/AuthCacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
              example: { id: 17010000-0000-4000-8000-000000000001, email: jimin@example.com, nickname: 지민 }
        '401':
          description: INVALID_TOKEN. 액세스 토큰이 없거나 유효하지 않거나 만료되었다.
          headers:
            Cache-Control: { $ref: '#/components/headers/AuthCacheControl' }
            WWW-Authenticate:
              schema: { type: string, const: Bearer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthError' }
              example: { code: INVALID_TOKEN, message: 유효한 액세스 토큰이 필요합니다. }
  /tables:
    post:
      tags: [테이블]
      summary: 테이블 생성과 첫 착석
      operationId: createTable
      security: [{}, { GuestCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, nickname, goal]
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                nickname: { $ref: '#/components/schemas/Nickname' }
                goal: { $ref: '#/components/schemas/Goal' }
            example: { name: 창가 테이블, nickname: 유진, goal: 인증 API 테스트 작성 }
      responses:
        '201':
          description: 4인 테이블 생성 및 생성자 착석 완료
          headers:
            Set-Cookie: { $ref: '#/components/headers/GuestCookie' }
          content:
            application/json:
              schema:
                type: object
                required: [table, invitePath]
                properties:
                  table: { $ref: '#/components/schemas/TableSnapshot' }
                  invitePath: { type: string, example: '/join#token=example-token-0123456789abcdef' }
        '409':
          description: IDEMPOTENCY_CONFLICT
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        default: { $ref: '#/components/responses/Error' }
  /invitations/preview:
    post:
      tags: [테이블]
      summary: 초대 링크의 테이블 요약 확인
      operationId: previewInvitation
      security: []
      description: 초대 토큰을 검증하고 이름, 정원, 인원, 단계만 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { $ref: '#/components/schemas/InviteToken' }
      responses:
        '200':
          description: 초대 테이블 요약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableSummary' }
              example: { name: 창가 테이블, capacity: 4, seatedCount: 2, phase: WAITING, expiresAt: '2026-11-18T11:00:00Z' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Expired' }
        default: { $ref: '#/components/responses/Error' }
  /invitations/join:
    post:
      tags: [테이블]
      summary: 초대 링크로 자리 앉기
      operationId: joinTable
      security: [{}, { GuestCookie: [] }]
      description: |
        WAITING 또는 BREAK에 들어오면 목표를 다음 라운드에 사용한다.
        FOCUS 중 새로 착석하면 현재 라운드의 남은 시간에 같은 타이머로 합류한다.
        이미 착석한 게스트는 기존 멤버와 목표를 복원한다. 퇴장 후 재착석해 같은
        라운드에 참여 이력이 있으면 기존 목표와 회고를 유지한다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, nickname, goal]
              properties:
                token: { $ref: '#/components/schemas/InviteToken' }
                nickname: { $ref: '#/components/schemas/Nickname' }
                goal: { $ref: '#/components/schemas/Goal' }
            example: { token: example-token-0123456789abcdef, nickname: 지민, goal: 로그인 실패 케이스 테스트 2개 추가 }
      responses:
        '200':
          description: 현재 좌석 또는 복구한 좌석
          headers:
            Set-Cookie: { $ref: '#/components/headers/GuestCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TableSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: TABLE_FULL 또는 IDEMPOTENCY_CONFLICT
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410': { $ref: '#/components/responses/Expired' }
        default: { $ref: '#/components/responses/Error' }
  /tables/{tableId}:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [테이블]
      summary: 현재 테이블과 내 좌석 복원
      operationId: getTable
      responses:
        '200': { $ref: '#/components/responses/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Expired' }
  /tables/{tableId}/events:
    parameters:
      - $ref: '#/components/parameters/TableId'
    get:
      tags: [테이블]
      summary: 테이블 변경 구독
      operationId: subscribeTable
      description: |
        EventSource로 같은 오리진에 연결한다. 연결과 재연결 직후 snapshot 이벤트를 보내고,
        착석·퇴장·목표·자리 상태·라운드 전환·공개 회고에 변경이 생기면 최신 snapshot을 보낸다.
        id는 snapshot.version이며 data는 TableSnapshot JSON이다.
        집중 중 도움 요청 변경은 요청한 게스트의 연결에만 보낸다. 15초마다 주석으로 연결을 유지한다.
        좌석이 해제되거나 테이블이 만료되면 연결을 닫는다. 이후에는 GET으로 권한과 상태를 확인한다.
      responses:
        '200':
          description: UTF-8 Server-Sent Events 스트림
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                id: 7
                event: snapshot
                data: {"id":"17010000-0000-4000-8000-000000000001","name":"창가 테이블","capacity":4,"seatedCount":1,"phase":"WAITING","expiresAt":"2026-11-18T11:00:00Z","version":7,"serverNow":"2026-11-11T11:00:00Z","myMemberId":"17010000-0000-4000-8000-000000000002","members":[{"id":"17010000-0000-4000-8000-000000000002","nickname":"지민","presence":"PRESENT","nextGoal":"테스트 추가"}],"latestRound":null}

        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Expired' }
  /tables/{tableId}/members/me:
    parameters:
      - $ref: '#/components/parameters/TableId'
    delete:
      tags: [테이블]
      summary: 자리 나가기
      operationId: leaveTable
      description: 좌석을 비우고 해당 세션의 구독을 닫는다. 이미 나간 멤버가 재시도해도 204다.
      responses:
        '204': { description: 자리 해제 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Expired' }
  /tables/{tableId}/members/me/presence:
    parameters:
      - $ref: '#/components/parameters/TableId'
    put:
      tags: [테이블]
      summary: 잠시 비움 또는 자리 복귀
      operationId: setPresence
      description: 좌석은 유지하고 내 표시 상태를 바꾼다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [presence]
              properties:
                presence: { $ref: '#/components/schemas/Presence' }
            example: { presence: AWAY }
      responses:
        '200': { $ref: '#/components/responses/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Expired' }
        default: { $ref: '#/components/responses/Error' }
  /tables/{tableId}/members/me/goal:
    parameters:
      - $ref: '#/components/parameters/TableId'
    put:
      tags: [테이블]
      summary: 다음 라운드 목표 설정
      operationId: setGoal
      description: WAITING 단계에서 목표를 등록하거나 바꾼다. 목표가 등록되면 다음 라운드에 참여할 준비가 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [goal]
              properties:
                goal: { $ref: '#/components/schemas/Goal' }
            example: { goal: 만료 토큰 테스트 추가 }
      responses:
        '200': { $ref: '#/components/responses/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/WrongPhase' }
        '410': { $ref: '#/components/responses/Expired' }
        default: { $ref: '#/components/responses/Error' }
  /tables/{tableId}/rounds:
    parameters:
      - $ref: '#/components/parameters/TableId'
    post:
      tags: [라운드]
      summary: 함께 집중 시작
      operationId: startRound
      description: |
        WAITING에서 현재 자리에 있고 목표가 있는 멤버가 시작할 수 있다.
        PRESENT 상태이고 목표가 있는 멤버를 참여자로 고정하고 사용한 nextGoal을 비운다.
        같은 테이블에서 동시에 하나의 라운드만 진행된다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': { $ref: '#/components/responses/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: WRONG_PHASE, GOAL_REQUIRED, MEMBER_AWAY 또는 IDEMPOTENCY_CONFLICT
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410': { $ref: '#/components/responses/Expired' }
        default: { $ref: '#/components/responses/Error' }
  /tables/{tableId}/rounds/{roundId}/participants/me/help:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/RoundId'
    put:
      tags: [라운드]
      summary: 휴식 때 도움 요청 예약 또는 취소
      operationId: setHelpRequest
      description: FOCUS 단계에서 현재 라운드 참여자가 설정한다. 휴식이 시작되면 해당 목표와 함께 테이블 멤버에게 공개한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requested]
              properties:
                requested: { type: boolean }
            example: { requested: true }
      responses:
        '200': { $ref: '#/components/responses/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotParticipant' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/WrongPhase' }
        '410': { $ref: '#/components/responses/Expired' }
        default: { $ref: '#/components/responses/Error' }
  /tables/{tableId}/rounds/{roundId}/participants/me/review:
    parameters:
      - $ref: '#/components/parameters/TableId'
      - $ref: '#/components/parameters/RoundId'
    put:
      tags: [라운드]
      summary: 회고 작성 또는 수정
      operationId: putReview
      description: 최근 라운드 참여자가 BREAK 시작부터 다음 라운드 시작 전까지 자신의 회고 한 건을 저장한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
            example: { result: CONTINUE, note: 만료 토큰 케이스를 같이 보고 싶어요. }
      responses:
        '200': { $ref: '#/components/responses/Snapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotParticipant' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/WrongPhase' }
        '410': { $ref: '#/components/responses/Expired' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    AccountBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    GuestCookie:
      type: apiKey
      in: cookie
      name: COGOM_GUEST
  headers:
    AuthCacheControl:
      schema: { type: string, const: no-store }
    GuestCookie:
      description: 신규 또는 갱신 세션에만 발급하는 게스트 쿠키
      schema: { type: string }
  parameters:
    TableId:
      name: tableId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoundId:
      name: roundId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
  responses:
    AuthValidationError:
      description: VALIDATION_ERROR. JSON이 없거나 잘못되었거나, 본문이 객체가 아니거나, 필드가 누락되었거나, 값이 문자열이 아니거나, 필드 제약을 위반했거나, 정의되지 않은 필드가 있다.
      headers:
        Cache-Control: { $ref: '#/components/headers/AuthCacheControl' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthError' }
          example: { code: VALIDATION_ERROR, message: 올바른 이메일 주소를 입력해 주세요. }
    AuthUnsupportedMediaType:
      description: Content-Type이 application/json이 아니면 프레임워크가 415를 반환한다.
    Snapshot:
      description: 요청 적용 후 테이블 전체 상태
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TableSnapshot' }
          examples:
            waiting:
              value:
                id: 17010000-0000-4000-8000-000000000001
                name: 창가 테이블
                capacity: 4
                seatedCount: 1
                phase: WAITING
                expiresAt: '2026-11-18T11:00:00Z'
                version: 7
                serverNow: '2026-11-11T11:00:00Z'
                myMemberId: 17010000-0000-4000-8000-000000000002
                members:
                  - id: 17010000-0000-4000-8000-000000000002
                    nickname: 지민
                    presence: PRESENT
                    nextGoal: 테스트 추가
                latestRound: null
            break:
              value:
                id: 17010000-0000-4000-8000-000000000001
                name: 창가 테이블
                capacity: 4
                seatedCount: 1
                phase: BREAK
                expiresAt: '2026-11-18T11:00:00Z'
                version: 11
                serverNow: '2026-11-11T11:26:00Z'
                myMemberId: 17010000-0000-4000-8000-000000000002
                members:
                  - id: 17010000-0000-4000-8000-000000000002
                    nickname: 지민
                    presence: PRESENT
                    nextGoal: null
                latestRound:
                  id: 17010000-0000-4000-8000-000000000003
                  number: 1
                  phase: BREAK
                  startedAt: '2026-11-11T11:00:00Z'
                  focusEndsAt: '2026-11-11T11:25:00Z'
                  breakEndsAt: '2026-11-11T11:30:00Z'
                  participants:
                    - memberId: 17010000-0000-4000-8000-000000000002
                      nickname: 지민
                      goal: 테스트 추가
                      helpRequested: true
                      review:
                        result: CONTINUE
                        note: 만료 토큰 케이스를 같이 보고 싶어요.
                        updatedAt: '2026-11-11T11:26:00Z'
    Unauthorized:
      description: GUEST_SESSION_REQUIRED. 세션이 없거나 만료되었다.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotParticipant:
      description: NOT_PARTICIPANT. 테이블 멤버에게 해당 라운드 참여 기록이 없다.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: NOT_FOUND. 토큰 또는 대상이 유효하지 않거나 해당 테이블의 좌석이 없다.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Expired:
      description: TABLE_EXPIRED. 이미 유효했던 테이블이나 초대 링크의 사용 기간이 끝났다.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    WrongPhase:
      description: WRONG_PHASE. 최신 snapshot을 읽고 화면을 갱신한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: WRONG_PHASE, message: 휴식이 끝나면 다음 목표를 등록할 수 있어요. }
    Error:
      description: 400 INVALID_INPUT, 403 ORIGIN_FORBIDDEN, 429 RATE_LIMITED 또는 500 INTERNAL_ERROR
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    AccountEmailInput:
      type: string
      description: 앞뒤 공백을 제거하고 소문자로 변환한다. 최대 254자이며 @ 앞 부분은 최대 64자다. 도메인에 점이 포함된 ASCII 이메일 주소여야 한다.
    SignupPasswordInput:
      type: string
      minLength: 15
      maxLength: 128
      description: 유니코드 코드 포인트 기준 15~128개다. 대소문자와 공백을 포함한 입력값을 그대로 사용하고 Argon2id로 해시해 저장한다.
    LoginPasswordInput:
      type: string
      minLength: 1
      maxLength: 128
      description: 유니코드 코드 포인트 기준 1~128개다. 대소문자와 공백을 포함한 입력값을 그대로 사용한다.
    AccountNicknameInput:
      type: string
      description: 앞뒤 공백을 제거한 뒤 UTF-16 코드 단위 기준 1~16개여야 한다.
    Account:
      type: object
      required: [id, email, nickname]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        nickname: { type: string, minLength: 1, maxLength: 16 }
    LoginResult:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, const: 1800, description: 액세스 토큰 유효 시간(초) }
        user: { $ref: '#/components/schemas/Account' }
    AuthError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Health:
      type: object
      required: [status, serverNow]
      properties:
        status: { type: string, const: UP }
        serverNow: { $ref: '#/components/schemas/Timestamp' }
    Timestamp:
      type: string
      format: date-time
      description: UTC ISO 8601
    InviteToken:
      type: string
      minLength: 24
      maxLength: 128
    Nickname:
      type: string
      minLength: 1
      maxLength: 16
      description: 앞뒤 공백을 제거하고 검증한다.
    Goal:
      type: string
      minLength: 1
      maxLength: 70
      description: 앞뒤 공백을 제거한 한 줄 텍스트
    Presence:
      type: string
      enum: [PRESENT, AWAY]
    TableSummary:
      type: object
      required: [name, capacity, seatedCount, phase, expiresAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        capacity: { type: integer, const: 4 }
        seatedCount: { type: integer, minimum: 0, maximum: 4 }
        phase: { type: string, enum: [WAITING, FOCUS, BREAK] }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    TableSnapshot:
      allOf:
        - $ref: '#/components/schemas/TableSummary'
        - type: object
          required: [id, version, serverNow, myMemberId, members, latestRound]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, minimum: 1 }
            serverNow: { $ref: '#/components/schemas/Timestamp' }
            myMemberId: { type: string, format: uuid }
            members:
              type: array
              maxItems: 4
              items: { $ref: '#/components/schemas/Member' }
            latestRound:
              oneOf:
                - $ref: '#/components/schemas/Round'
                - type: 'null'
    Member:
      type: object
      required: [id, nickname, presence, nextGoal]
      properties:
        id: { type: string, format: uuid }
        nickname: { $ref: '#/components/schemas/Nickname' }
        presence: { $ref: '#/components/schemas/Presence' }
        nextGoal:
          oneOf:
            - $ref: '#/components/schemas/Goal'
            - type: 'null'
    Round:
      type: object
      required: [id, number, phase, startedAt, focusEndsAt, breakEndsAt, participants]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        phase: { type: string, enum: [FOCUS, BREAK, FINISHED] }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        focusEndsAt: { $ref: '#/components/schemas/Timestamp' }
        breakEndsAt: { $ref: '#/components/schemas/Timestamp' }
        participants:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
    Participant:
      type: object
      required: [memberId, nickname, goal, helpRequested, review]
      properties:
        memberId: { type: string, format: uuid }
        nickname: { $ref: '#/components/schemas/Nickname' }
        goal: { $ref: '#/components/schemas/Goal' }
        helpRequested:
          type: [boolean, 'null']
          description: 집중 중에는 내 값만 반환하고 동료의 값은 null이다.
        review:
          oneOf:
            - $ref: '#/components/schemas/Review'
            - type: 'null'
    ReviewInput:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result:
          type: string
          enum: [DONE, CONTINUE, BLOCKED]
          description: 완료, 이어서, 막힘
        note:
          type: string
          maxLength: 140
          default: ''
          description: 빈 문자열이나 생략은 메모를 비운다.
    Review:
      type: object
      required: [result, note, updatedAt]
      properties:
        result: { $ref: '#/components/schemas/ReviewInput/properties/result' }
        note: { $ref: '#/components/schemas/ReviewInput/properties/note' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        field:
          type: string
          description: 입력 검증 오류의 필드명
