# CoGom 백엔드 + PostgreSQL
#
# 서버 배포: GitHub Actions가 이 파일과 .env를 ~/cogom 에 올리고 deploy/deploy.sh 로 기동한다.
# 로컬 실행: .env.example 을 .env 로 복사해 값을 채운 뒤 `docker compose up -d --build`
name: cogom

services:
  db:
    image: postgres:17
    container_name: cogom-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cogom}
      POSTGRES_USER: ${DB_USER:-cogom}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
    volumes:
      # 이름 있는 볼륨(cogom_pgdata)에 저장하므로 컨테이너를 지우거나 재배포해도 데이터가 남는다.
      - pgdata:/var/lib/postgresql/data
    # ports 를 선언하지 않는다. 5432 는 호스트와 외부에 열리지 않고 backend 네트워크 안에서만 접근된다.
    networks:
      - backend
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    # 서버에서는 CI가 올린 GHCR 이미지를 쓰고, 로컬에서는 build 로 직접 만든다.
    image: ${APP_IMAGE:-cogom-api:local}
    build:
      context: .
    container_name: cogom-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      COGOM_DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-cogom}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-cogom}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      COGOM_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 을 .env 에 설정하세요}
      # 다른 출처의 프런트엔드(Vercel 등)를 허용할 때 쉼표로 구분해 지정한다. 비우면 같은 출처만 허용한다.
      COGOM_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SERVER_ADDRESS: 0.0.0.0
      # Nginx 뒤에서 X-Forwarded-* 를 신뢰한다. HTTPS 동일 출처 판정(WebSocket)과
      # 로그인 시도 제한의 클라이언트 IP 식별에 필요하다.
      SERVER_FORWARD_HEADERS_STRATEGY: native
    ports:
      # HTTP API 와 WebSocket(/ws/study-room)이 같은 포트를 쓴다.
      # Nginx 를 붙인 뒤에는 APP_BIND=127.0.0.1 로 바꿔 외부 직접 접근을 막는다.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 40s
    stop_grace_period: 40s
    logging: *default-logging

volumes:
  pgdata:

networks:
  backend:
