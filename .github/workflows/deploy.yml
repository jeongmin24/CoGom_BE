# main 브랜치에 push 되면 빌드 → 이미지 푸시(GHCR) → EC2 배포를 수행한다.
#
# ARM64 대응: 러너는 x86_64 이지만 Dockerfile 의 빌드 단계가 $BUILDPLATFORM(러너 네이티브)에서
# 돌고 실행 단계에는 RUN 이 없으므로, buildx 가 에뮬레이션 없이 linux/arm64 이미지를 만든다.
# 필요한 Secrets 와 서버 준비 과정은 docs/deployment.md 참고.
name: Deploy

on:
  push:
    # develop 도 배포하려면 [main, develop] 로 바꾸고 deploy job 의 if 조건을 함께 수정한다.
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# 배포가 겹치지 않도록 한 번에 하나만 실행한다. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # 배포 서버(c6g, Graviton)는 linux/arm64. amd64 를 함께 올려 두면 x86 서버나 로컬에서도 같은 이미지를 쓴다.
  IMAGE_PLATFORMS: linux/arm64,linux/amd64
  # 서버 홈 디렉터리 기준 배포 경로
  DEPLOY_DIR: cogom

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven 빌드 및 테스트
        run: mvn -B -ntp verify

      - name: 이미지 이름 계산
        id: image
        run: |
          # GHCR 이미지 이름은 소문자여야 한다.
          name="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "ref=${name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # 현재 Dockerfile 은 에뮬레이션이 필요 없지만, 실행 단계에 RUN 이 추가되어도 arm64 빌드가 깨지지 않게 둔다.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.IMAGE_PLATFORMS }}
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            docker-compose.yml
            deploy
          sparse-checkout-cone-mode: false

      - name: 필수 Secrets 확인
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=0
          for name in EC2_HOST EC2_SSH_KEY DB_PASSWORD JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name} 이(가) 비어 있습니다."
              missing=1
            fi
          done
          exit "$missing"

      - name: SSH 설정
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            # 권장: 미리 등록한 호스트 키만 신뢰한다.
            printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # 미등록 시 접속 시점의 호스트 키를 받아 신뢰한다.
            ssh-keyscan -T 10 "$EC2_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          cat > ~/.ssh/config <<CONFIG
          Host ec2
            HostName ${EC2_HOST}
            User ${EC2_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          CONFIG
          chmod 600 ~/.ssh/config

      - name: 배포 파일 업로드
        run: |
          ssh ec2 "mkdir -p ~/${DEPLOY_DIR}"
          scp docker-compose.yml deploy/deploy.sh "ec2:${DEPLOY_DIR}/"
          # Windows 에서 커밋하면 실행 비트가 빠지므로 서버에서 부여한다.
          ssh ec2 "chmod +x ~/${DEPLOY_DIR}/deploy.sh"

      - name: 서버 .env 생성
        env:
          DB_NAME: ${{ vars.DB_NAME || 'cogom' }}
          DB_USER: ${{ vars.DB_USER || 'cogom' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          APP_BIND: ${{ vars.APP_BIND || '0.0.0.0' }}
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
        run: |
          # 값은 명령줄 인자가 아니라 표준 입력으로 전달해 서버의 프로세스 목록에 남지 않게 한다.
          ssh ec2 "umask 077 && cat > ~/${DEPLOY_DIR}/.env && chmod 600 ~/${DEPLOY_DIR}/.env" <<ENVFILE
          APP_IMAGE=${IMAGE}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD='${DB_PASSWORD}'
          JWT_SECRET='${JWT_SECRET}'
          ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
          APP_BIND=${APP_BIND}
          APP_PORT=${APP_PORT}
          ENVFILE

      - name: 배포 (이미지 pull → 컨테이너 교체 → 헬스체크, 실패 시 롤백)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh ec2 "docker login ${REGISTRY} -u '${GHCR_USER}' --password-stdin" <<< "$GHCR_TOKEN"
          ssh ec2 "bash ~/${DEPLOY_DIR}/deploy.sh '${IMAGE}'"

      - name: 정리
        if: always()
        run: |
          ssh ec2 "docker logout ${REGISTRY}" || true
          rm -f ~/.ssh/deploy_key
