spring:
  application:
    name: cogom-api
  datasource:
    url: "${COGOM_DB_URL:jdbc:h2:file:./data/cogom}"
    username: sa
    password: ""
  sql:
    init:
      mode: always
server:
  address: 127.0.0.1
  port: 8080
cogom:
  auth:
    jwt-secret: "${COGOM_JWT_SECRET:}"
  web:
    # 다른 출처의 프런트엔드를 허용할 때 쉼표로 구분해 지정한다. 기본값은 로컬 Vite 개발 서버.
    allowed-origins: "${COGOM_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}"
